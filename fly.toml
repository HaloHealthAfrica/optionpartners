app = "optionpartners"
primary_region = "iad"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "90s"
  interval = "15s"
  method = "GET"
  path = "/api/health"
  timeout = "10s"
  headers = { X-Forwarded-Proto = "https" }

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Data service (optionpartners-data) — backend fetches quotes, chains, VIX, regime from here
  DATA_SERVICE_URL = "https://optionpartners-data.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
